<div class="calculator-app">
  <div class="calculator">
    <div class="display">
      <div class="expression">{{ expression() }}</div>
      <div class="result">{{ display() }}</div>
    </div>

    <div class="buttons">
      <button class="btn clear" (click)="clear()">C</button>
      <button class="btn operator" (click)="toggleSign()">+/-</button>
      <button class="btn operator" (click)="inputPercent()">%</button>
      <button class="btn operator" (click)="setOperator('/')">÷</button>

      <button class="btn" (click)="inputDigit('7')">7</button>
      <button class="btn" (click)="inputDigit('8')">8</button>
      <button class="btn" (click)="inputDigit('9')">9</button>
      <button class="btn operator" (click)="setOperator('*')">×</button>

      <button class="btn" (click)="inputDigit('4')">4</button>
      <button class="btn" (click)="inputDigit('5')">5</button>
      <button class="btn" (click)="inputDigit('6')">6</button>
      <button class="btn operator" (click)="setOperator('-')">−</button>

      <button class="btn" (click)="inputDigit('1')">1</button>
      <button class="btn" (click)="inputDigit('2')">2</button>
      <button class="btn" (click)="inputDigit('3')">3</button>
      <button class="btn operator" (click)="setOperator('+')">+</button>

      <button class="btn zero" (click)="inputDigit('0')">0</button>
      <button class="btn" (click)="inputDecimal()">.</button>
      <button class="btn equals" (click)="calculate()">=</button>
    </div>

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
  </div>

  <div class="history-panel">
    <h2>History</h2>
    @if (history().length === 0) {
      <p class="empty">No calculations yet.</p>
    }
    <ul>
      @for (item of history(); track item.id) {
        <li>
          <span class="calc-text">
            {{ item.a }} {{ operationSymbol(item.operation) }} {{ item.b }} = {{ item.result }}
          </span>
          <button class="delete-btn" (click)="deleteFromHistory(item.id)" title="Delete">&times;</button>
        </li>
      }
    </ul>
  </div>
</div>
